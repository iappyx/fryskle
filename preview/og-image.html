<!DOCTYPE html>
<!-- Source of og-image.jpg, the link-preview image (Open Graph). Render: bash preview/make_og_image.sh
     Example words are years away as daily words (fûgel ~ day 3532, skiep ~5337, grien ~4213). -->
<html lang="fy">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(900px 620px at 0% 0%, #1c3358 0%, #0F1A2B 60%); color: #E7EDF6;
         font-family: "Figtree", system-ui, sans-serif; position: relative; }
  .flag { position: absolute; left: 0; right: 0; bottom: 0; height: 18px;
          background: repeating-linear-gradient(-150deg, #3C7DD8 0 36px, #E7EDF6 36px 72px); opacity: .9; }
  .text { position: absolute; left: 80px; top: 0; bottom: 40px; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font: 800 112px/1 "Bricolage Grotesque", "Arial Narrow", sans-serif; letter-spacing: -.03em; margin: 0;
       display: flex; align-items: center; gap: 18px; }
  h1 svg { width: 88px; height: 88px; }
  p { font-size: 36px; line-height: 1.3; margin: 26px 0 0; color: #c9d4e6; }
  .modes { display: flex; gap: 12px; margin-top: 34px; }
  .modes span { border: 2px solid #34445E; border-radius: 999px; padding: 8px 22px; font-weight: 600; font-size: 26px; color: #A3B0C4; }
  .modes span.on { background: #3C7DD8; border-color: #3C7DD8; color: #fff; }
  .board { position: absolute; right: 90px; top: 92px; display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: repeat(5, 84px); gap: 12px; }
  .tile { height: 84px; border-radius: 10px; display: grid; place-items: center;
          font: 800 46px "Bricolage Grotesque", sans-serif; color: #fff; border: 3px solid #34445E; background: #17243A; }
  .c { background: #3C7DD8; border-color: #3C7DD8; } .p { background: #D69E27; border-color: #D69E27; } .a { background: #4A5770; border-color: #4A5770; }
</style>
</head>
<body>
  <div class="text">
    <h1><svg viewBox="-13.5 -16.5 30 30" aria-hidden="true"><path d="M0,12A16.143,16.143 0 0,1 -14,-4A7,8 0 0,1 -7,-12A6,8 0 0,1 -1,-5A1,1 0 1,0 1,-5A6,8 0 0,1 7,-12A7,8 0 0,1 14,-4A16.143,16.143 0 0,1 0,12z" fill="#E23B3B" transform="rotate(34.695)"/></svg>Fryskle</h1>
    <p>It deistige Fryske wurdspul. Rie alle dagen in nij wurd.</p>
    <div class="modes"><span>4</span><span class="on">5 letters</span><span>6</span><span>7</span></div>
  </div>
  <div class="board">
    <div class="row"><div class="tile a">s</div><div class="tile a">k</div><div class="tile a">i</div><div class="tile c">e</div><div class="tile a">p</div></div>
    <div class="row"><div class="tile p">g</div><div class="tile a">r</div><div class="tile a">i</div><div class="tile c">e</div><div class="tile a">n</div></div>
    <div class="row"><div class="tile c">f</div><div class="tile c">û</div><div class="tile c">g</div><div class="tile c">e</div><div class="tile c">l</div></div>
    <div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>
  </div>
  <div class="flag"></div>
</body>
</html>
